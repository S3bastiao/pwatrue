<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050507">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">

<title>Central Sebian</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;800&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400&display=swap">
<style>
:root{--bg:#050507;--fg:#eef6fc;--mut:#7f8a96;--line:rgba(179,226,255,.16);--ice:#b3e2ff;--ice2:#eaf7ff;--ice3:#5aa9e0;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--fg);font:500 15px/1.4 Archivo,system-ui,sans-serif}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.fb{position:fixed;left:50%;top:18vh;width:40vw;aspect-ratio:1;translate:-50% 0;background:var(--ice);clip-path:polygon(50% 100%,0 35%,20% 0,80% 0,100% 35%);opacity:.5;display:none}
.hud{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 8px) 14px 18px;font:400 11px/1 'JetBrains Mono',ui-monospace,monospace;color:var(--mut);background:linear-gradient(#050507e6,transparent)}
.hud b{color:var(--fg);font-weight:400;display:flex;align-items:center;gap:8px}
.hud b::before{content:"";width:9px;height:9px;background:var(--ice);clip-path:polygon(50% 100%,0 35%,20% 0,80% 0,100% 35%)}
.hud div{display:flex;align-items:center;gap:8px}
.bell{width:44px;height:44px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;color:var(--fg)}
.bell.on{border-color:var(--ice);color:var(--ice)}
main{position:relative;z-index:1}
.hero{height:68vh;min-height:470px;display:flex;flex-direction:column;justify-content:flex-end;padding:0 20px 20px;gap:18px}
.tt i{display:block;font:italic 400 clamp(60px,19vw,120px)/.8 'Instrument Serif',Georgia,serif;letter-spacing:-.02em}
.tt h1{margin:4px 0 0;font:800 clamp(52px,17.5vw,112px)/.85 Archivo,sans-serif;letter-spacing:-.05em;background:linear-gradient(180deg,var(--ice2),var(--ice) 55%,var(--ice3));-webkit-background-clip:text;background-clip:text;color:transparent}
.hr2{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.big{font:800 44px/.9 Archivo,sans-serif;letter-spacing:-.04em}
.hr2 small{display:block;margin-top:6px;font:400 11px/1.4 'JetBrains Mono',monospace;color:var(--mut)}
.nb{display:inline-flex;align-items:center;gap:8px;min-height:50px;padding:0 22px;border-radius:30px;background:var(--ice);color:#050507;font-weight:800;box-shadow:0 0 30px rgba(179,226,255,.35)}
.nb:active{scale:.95}
.sh{background:linear-gradient(180deg,rgba(5,5,7,0),rgba(5,5,7,.88) 70px);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:22px 16px 150px;min-height:64vh}
h2{margin:0 0 16px;display:flex;justify-content:space-between;align-items:baseline;font:italic 400 42px/1 'Instrument Serif',Georgia,serif}
h2 span{font:800 13px/1 Archivo,sans-serif;font-style:normal;color:var(--mut)}
h4{margin:0 0 12px;font:italic 400 24px/1 'Instrument Serif',Georgia,serif}
.bx,.tk,.pj{border:1px solid var(--line);border-radius:22px;background:rgba(179,226,255,.035);margin-bottom:12px}
.bx{padding:16px}
.gr{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.gr div{border:1px solid var(--line);border-radius:18px;padding:12px;background:rgba(179,226,255,.035)}
.gr b{display:block;font:800 28px/1 Archivo,sans-serif;letter-spacing:-.03em}
.gr small{font-size:12px;color:var(--mut)}
.nx b{display:block;font-size:19px;font-weight:800;letter-spacing:-.02em}
.nx small{color:var(--mut)}
.nx .cd{display:inline-block;margin-top:10px;padding:6px 12px;border-radius:20px;background:var(--ice);color:#050507;font-weight:800;font-size:13px}
.fo{display:flex;align-items:center;gap:16px}
.fo svg{flex:none;width:100px;height:100px;rotate:-90deg}
.fo circle{fill:none;stroke-width:5}
.fo .tm{font:800 34px/1 Archivo,sans-serif;letter-spacing:-.03em}
.fo .ch{display:flex;gap:6px;margin:10px 0 0;flex-wrap:wrap}

.tk{display:flex;gap:12px;padding:14px}

.tk[data-p="1"]{box-shadow:inset 3px 0 0 var(--ice3)}
.pj{padding:6px 14px 8px}
.pj .tk{background:rgba(179,226,255,.03);border-radius:16px;margin:0 0 8px}
.ck{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--mut);position:relative;margin-top:2px}
.ck:active{scale:.9}
.tk.on .ck{border-color:transparent;background:linear-gradient(135deg,var(--ice2),var(--ice3))}
.tk.on .ck::after{content:"";position:absolute;left:10px;top:6px;width:6px;height:12px;border:solid #050507;border-width:0 2.5px 2.5px 0;rotate:45deg}
.tk.on b{color:var(--mut);text-decoration:line-through;text-decoration-color:var(--line)}
.bd{flex:1;min-width:0}
.hd{display:block;width:100%;text-align:left;min-height:44px;padding:4px 0}
.pj>.hd{padding:10px 0 8px}
.hd b{display:block;font-weight:800;font-size:16px;letter-spacing:-.01em}
.hd small{display:flex;flex-wrap:wrap;gap:4px 12px;font:400 11px/1.6 'JetBrains Mono',ui-monospace,monospace;color:var(--mut);margin-top:3px}
.hd em{font:800 30px/1 Archivo,sans-serif;font-style:normal;letter-spacing:-.04em;float:right;margin-top:-4px}
.br{height:3px;border-radius:3px;background:var(--line);margin-top:8px;overflow:hidden}
.br i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--ice3),var(--ice),#fff);transition:width .6s cubic-bezier(.2,.8,.2,1)}
.sp{display:grid;gap:2px;margin-top:10px}
.sp>button:not(.rm){display:flex;align-items:center;gap:12px;min-height:44px;text-align:left}
.dt{flex:none;width:18px;height:18px;border-radius:50%;border:1.5px solid var(--mut)}
.sp .on{color:var(--mut)}
.sp .on .dt{background:var(--ice);border-color:var(--ice)}
.ad{display:flex;gap:8px;margin-top:6px}
.ad button{flex:none;padding:0 14px;min-height:46px;border-radius:12px;border:1px solid var(--line)}
.rm{min-height:44px;color:#ff8c9a;text-align:left}
input,textarea,select{width:100%;min-height:46px;padding:10px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(179,226,255,.05);color:var(--fg);font:500 16px Archivo,sans-serif}
input:focus-visible,textarea:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
.em{padding:34px 10px;text-align:center;color:var(--mut)}
.em b{display:block;font:italic 400 28px 'Instrument Serif',Georgia,serif;color:var(--fg);margin-bottom:6px}
.fl{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 12px;padding:0 16px;scrollbar-width:none}
.fl button{flex:none}
.fl small{opacity:.6;margin-left:4px}
.dy{display:flex;gap:8px;overflow-x:auto;padding:0 16px 14px;margin:0 -16px 8px;scrollbar-width:none}
.dy button{flex:none;width:56px;height:76px;border:1px solid var(--line);border-radius:18px;display:grid;place-items:center;align-content:center;gap:2px}
.dy small{font:400 11px 'JetBrains Mono',monospace;color:var(--mut)}
.dy b{font-size:20px;font-weight:800}
.dy i{width:5px;height:5px;border-radius:50%}
.dy i.has{background:var(--ice)}
.dy .on{background:var(--ice);color:#050507;border-color:var(--ice)}
.dy .on small{color:#050507}
.nv{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:20;display:grid;grid-template-columns:repeat(4,1fr);padding:6px;border:1px solid var(--line);border-radius:26px;background:rgba(8,10,14,.78);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.nv button{position:relative;min-height:58px;border-radius:20px;display:grid;place-items:center;align-content:center;gap:3px;color:var(--mut);font-size:11px;font-weight:800}
.nv button.on{color:var(--ice);background:rgba(179,226,255,.08)}
.nv button.on::before{content:"";position:absolute;top:0;width:22px;height:2px;border-radius:2px;background:var(--ice);box-shadow:0 0 10px var(--ice)}
.md{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.68);display:none;align-items:flex-end}
.md.on{display:flex}
.md form{width:100%;max-height:92vh;overflow:auto;background:#0a0d11;border:1px solid var(--line);border-radius:26px 26px 0 0;padding:20px 16px calc(env(safe-area-inset-bottom,0px) + 20px);display:grid;gap:10px}
.md h3{margin:0;font:italic 400 34px/1 'Instrument Serif',Georgia,serif}
.md label{display:grid;gap:5px;font-size:13px;color:var(--mut)}
.md .rw{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.md .bt{display:flex;gap:10px;margin-top:4px}
.md .bt button{flex:1;min-height:50px;border-radius:14px;border:1px solid var(--line);font-weight:800}
.md .bt .ok{background:var(--ice);color:#050507;border-color:var(--ice)}
.md .mo{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.md .mo button{min-height:44px;border-radius:14px;border:1px solid var(--line);font-weight:800;color:var(--mut)}
.md .mo .on{background:var(--fg);color:#050507;border-color:var(--fg)}
form[data-m=pj] .t-o,form[data-m=t] .p-o{display:none}
.ts{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 56px);translate:-50% -14px;opacity:0;z-index:50;padding:10px 16px;border-radius:30px;background:var(--ice);color:#050507;font-weight:800;font-size:13px;transition:.3s;pointer-events:none}
.ts.on{opacity:1;translate:-50% 0}
.bell,.bx,.tk,.pj,.gr div,.ch button,.ad button,input,textarea,select,.dy button,.nv,.md form,.md .bt button,.md .mo button{border:0}
.bx,.tk,.pj,.pj .tk,.gr div{background:transparent}
.bx,.gr{border-top:1px solid var(--line);border-radius:0}
.gr{padding-top:14px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas><div class="fb" id="fb"></div>
<header class="hud"><b>Central Sebian</b><div><span id="ck"></span><button class="bell" data-a="bell" id="bell" aria-label="Ativar avisos"><svg class="i" viewBox="0 0 24 24"><path d="M6 9a6 6 0 0 1 12 0c0 6 2 7 2 7H4s2-1 2-7M10 20h4"/></svg></button></div></header>
<main>
<section class="hero" id="hero"><div class="tt"><i>Central</i><h1>SEBIAN</h1></div>
<div class="hr2"><div><span class="big"><span id="pc">0</span>%</span><small>progresso geral<br><span id="mt"></span></small></div><button class="nb" data-a="new"><svg class="i" viewBox="0 0 24 24" style="width:18px;height:18px;stroke-width:2.6"><path d="M12 5v14M5 12h14"/></svg>Novo</button></div></section>
<section class="sh" id="v"></section>
</main>
<nav class="nv" aria-label="Seções" id="nv"></nav>
<div class="md" id="md"><form id="f" data-m="t"><h3>Novo item</h3>
<div class="mo"><button type="button" class="on" data-a="mode" data-v="t">Tarefa</button><button type="button" data-a="mode" data-v="pj">Projeto</button></div>
<label>Nome<input name="t" required placeholder="Ex.: Entregar proposta"></label>
<label class="t-o">Projeto<input name="p" list="pl" placeholder="Escolha ou crie um projeto"><datalist id="pl"></datalist></label>
<div class="rw t-o"><label>Data<input name="d" type="date"></label><label>Hora<input name="h" type="time"></label></div>
<label class="t-o">Prioridade<select name="pr"><option value="0">Normal</option><option value="1">Importante</option><option value="2">Urgente</option></select></label>
<label class="t-o">Etapas, uma por linha<textarea name="s" rows="3" placeholder="Pesquisar&#10;Escrever&#10;Revisar"></textarea></label>
<label class="p-o">Prazo do projeto<input name="z" type="date"></label>
<div class="bt"><button type="button" id="cn">Cancelar</button><button class="ok" type="submit">Salvar</button></div></form></div>
<div class="ts" id="ts" role="status"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=s=>document.querySelector(s),K='sebian.v1',RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const D=n=>iso(new Date(Date.now()+n*864e5)),td=()=>D(0),uid=()=>Math.random().toString(36).slice(2,9);
const e=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const IC={painel:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',tarefas:'<path d="M9 6h11M9 12h11M9 18h11M3.5 6l1.5 1.5L7 5M3.5 12l1.5 1.5L7 11M3.5 18l1.5 1.5L7 17"/>',proj:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',ag:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>'};
const TABS=[['painel','Painel'],['tarefas','Tarefas'],['proj','Projetos'],['ag','Agenda']];
$('#nv').innerHTML=TABS.map(t=>`<button data-a="tab" data-t="${t[0]}"><svg class="i" viewBox="0 0 24 24">${IC[t[0]]}</svg>${t[1]}</button>`).join('');
function seed(){const a=uid(),b=uid(),c=uid(),T=td(),m=(p,t,d,h,pr,s,k,dn)=>({id:uid(),p,t,d,h,pr,k:!!k,dn,s:(s||[]).map(x=>({x:x[0],k:x[1]}))});
return{p:[{id:a,n:'Lançamento do app',z:D(12)},{id:b,n:'Estudos',z:D(30)},{id:c,n:'Pessoal'}],t:[
m(a,'Definir telas principais',T,'10:00',2,[['Esboçar o fluxo',1],['Escolher cores',1],['Validar com um amigo',0]]),
m(a,'Gravar vídeo de apresentação',T,'15:30',1,[['Escrever roteiro',0],['Gravar',0],['Editar',0]]),
m(b,'Curso de automação',D(1),'09:00',0,[['Módulo 1',1],['Módulo 2',0]]),
m(c,'Pagar fatura do cartão',D(-1),'',2,[]),
m(c,'Revisar anotações',T,'',0,[],1,T),m(c,'Organizar arquivos',D(-1),'',0,[],1,D(-1)),m(a,'Planejar semana',D(-2),'',1,[],1,D(-2)),m(b,'Enviar relatório',D(-2),'',0,[],1,D(-2)),m(c,'Fazer backup',D(-4),'',0,[],1,D(-4))]}}
let S;try{S=JSON.parse(localStorage.getItem(K))}catch(_){}S=S||seed();
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(_){}};
let tab='painel',flt='hoje',open={},pOpen={},sel=td(),pro=0,dp=0,pm={d:25,l:1500,r:0};
const un=t=>t.s.length?{d:t.s.filter(x=>x.k).length,n:t.s.length}:{d:t.k?1:0,n:1};
const sum=l=>l.reduce((a,t)=>{const u=un(t);return{d:a.d+u.d,n:a.n+u.n}},{d:0,n:0});
const pn=id=>(S.p.find(p=>p.id===id)||{}).n||'Geral';
const emp=(a,b)=>`<div class="em"><b>${a}</b>${b}</div>`;
const srt=(a,b)=>(a.k-b.k)||(a.h||'99').localeCompare(b.h||'99');
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const done=(t,v)=>{t.k=v;if(v)t.dn=td();else delete t.dn};
const dl=z=>Math.ceil((new Date(z+'T00:00')-new Date(td()+'T00:00'))/864e5);
const fd=z=>new Date(z+'T00:00').toLocaleDateString('pt-BR',{day:'numeric',month:'short'});
function card(t){const u=un(t),w=u.d/u.n*100,o=open[t.id],late=!t.k&&t.d&&t.d<td();
return `<div class="tk${t.k?' on':''}" data-p="${t.pr||0}"><button class="ck" data-a="tog" data-id="${t.id}" aria-label="${t.k?'Reabrir':'Concluir'} tarefa"></button><div class="bd"><button class="hd" data-a="open" data-id="${t.id}"><b>${e(t.t)}</b><small><span>${e(pn(t.p))}</span>${t.h?`<span>${t.h}</span>`:''}${late?`<span>atrasada</span>`:''}${t.pr==2?'<span>urgente</span>':''}${u.n>1?`<span>${u.d}/${u.n}</span>`:''}</small></button><div class="br"><i style="width:${w}%"></i></div>${o?`<div class="sp">${t.s.map((x,i)=>`<button class="${x.k?'on':''}" data-a="stp" data-id="${t.id}" data-i="${i}"><span class="dt"></span>${e(x.x)}</button>`).join('')}<div class="ad"><input id="in-${t.id}" placeholder="Nova etapa" enterkeyhint="done"><button data-a="addst" data-id="${t.id}">Adicionar</button></div><button class="rm" data-a="del" data-id="${t.id}">Excluir tarefa</button></div>`:''}</div></div>`}
function pjInfo(p){const ts=S.t.filter(t=>t.p===p.id),u=sum(ts),w=u.n?u.d/u.n*100:0;return{ts,w,z:p.z?`prazo ${fd(p.z)}, ${dl(p.z)>=0?`faltam ${dl(p.z)} dias`:'vencido'}`:'sem prazo'}}
function r(){const T=td(),now=new Date(),mn=now.getHours()*60+now.getMinutes();let h='';
if(tab==='painel'){
const tt=S.t.filter(t=>t.d===T),dn=tt.filter(t=>t.k).length,ov=S.t.filter(t=>!t.k&&t.d&&t.d<T).length;
const wk=[...Array(7)].map((_,i)=>{const d=D(i-6),n=S.t.filter(t=>t.k&&t.dn===d).length,dw=new Date(d+'T00:00').getDay();return{n,l:'DSTQQSS'[dw]}}),mx=Math.max(1,...wk.map(x=>x.n)),ws=wk.reduce((a,x)=>a+x.n,0);
const nx=S.t.filter(t=>!t.k&&t.d===T&&t.h).sort(srt)[0];let ntx='';
if(nx){const df=+nx.h.slice(0,2)*60+ +nx.h.slice(3)-mn;ntx=`<div class="nx"><b>${e(nx.t)}</b><small>${e(pn(nx.p))} às ${nx.h}</small><br><span class="cd">${df<0?'atrasado':df>=60?`em ${Math.floor(df/60)}h ${df%60}min`:`em ${df} min`}</span></div>`}
const C=2*Math.PI*45;
h=`<h2>Painel<span>${now.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'short'})}</span></h2>
<section class="bx"><h4>Próximo compromisso</h4>${ntx||'<div class="nx"><small>Nenhum compromisso com horário hoje.</small></div>'}</section>
<div class="gr"><div><b>${dn}/${tt.length}</b><small>feitas hoje</small></div><div><b>${ov}</b><small>atrasadas</small></div><div><b>${ws}</b><small>na semana</small></div></div>
